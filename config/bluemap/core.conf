##                          ##
##         BlueMap          ##
##       Core-Config        ##
##                          ##

# Craftoria Amici: mappa web del server, https://mappa-craftoria.casa.serod.tech
# Mod solo-server; questo file arriva anche ai client ma lì non viene letto.

# Scarica dai server Mojang il jar del client per le texture vanilla.
# TRUE = conferma di accettare l'EULA di Minecraft (già accettata per il server).
accept-download: true

# Dati di lavoro (avanzamento del render, tile). Escluso dai backup: si rigenera.
data: "bluemap"

# Thread di render: newboi ha 12 core, ne restano per il server e Distant Horizons.
render-thread-count: 3

# Carica texture e modelli dai mod e dai datapack.
scan-for-mod-resources: true

# Niente statistiche d'uso inviate all'autore.
metrics: false

log: {
  file: "bluemap/logs/debug.log"
  append: false
}
